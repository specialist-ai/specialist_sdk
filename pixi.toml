[workspace]
name = "specialist_sdk"
description = "C++ driver and Python bindings for the Specialist grippers (Feetech STS servos)"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
cxx-compiler = "*"
cmake = ">=3.16"
ninja = "*"

[activation.env]
CMAKE_GENERATOR = "Ninja"

[tasks.build]
cmd = "cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build"

[tasks.clean]
cmd = "rm -rf build"
description = "Wipe the CMake build directory"
